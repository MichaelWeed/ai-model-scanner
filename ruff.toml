[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "venv",
    ".venv",
    "env",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # allow non-abstract empty methods
    "B027",
    # allow magic value comparisons (common in CLI tools)
    "PLR2004",
    # UP006/UP007: keep typing.Dict/List for 3.9 compat (already imported)
    "UP006",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # allow assert statements in tests
    "S101",
    # allow magic value comparisons in tests
    "PLR2004",
]
